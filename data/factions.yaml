# 한국 신무협 세력 데이터 (v2.1 — 정파 디테일 추가)
#
# 2020년대 한국 무협 웹소설·웹툰(화산귀환·나노마신·광마회귀·망나니 소교주로 환생했다 등)에서
# 공통으로 등장하는 세력 풀. 자세한 기준은 docs/factions-reference.md 참고.
#
# 좌표계: WGS84 [위도, 경도]
# coord_confidence:
#   high   = 실존 지명, 좌표 명확 (예: 숭산, 라싸, 자금성)
#   medium = 실존 지명이지만 본거지 정확한 위치 추정
#   low    = 가공·위치 모호·작품마다 다름
#
# 데이터 구조:
#   common — 작품 막론 공통 정보 (한국 무협 일반론 + 나무위키 기준)
#   variants — 작품별 묘사 차이 (작품명을 키로, figures/role/note 등)
#     레퍼런스 작품 풀: 화산귀환, 나노마신, 광마회귀, 망나니 소교주로 환생했다, 북검전기
#     자유롭게 추가 가능 (variants 키는 정해진 enum 없음)

# ═════════════════════════════════════════════════════════
# 작품 카탈로그 (variants의 키와 매칭)
#
# 각 작품:
#   author: 작가 (웹툰화된 경우 스토리/작화 모두 표기)
#   platforms: [{ type, host }] — type=웹소설/웹툰/출판
#   summary: 한 줄 줄거리
# ═════════════════════════════════════════════════════════
works:
  # ─── 정파 중심 작품 풀 ───
  화산귀환:
    author: 비가
    platforms:
      - { type: 웹소설, host: 네이버 시리즈 }
      - { type: 웹툰, host: 네이버 웹툰 }
    summary: |
      천하삼대검수 매화검존이 100년 후 어린 시절로 환생해
      망해버린 화산파를 살리기 위해 분투하는 이야기.

  북검전기:
    author: 우각
    platforms:
      - { type: 웹소설, host: "카카오페이지·네이버 시리즈·리디·미스터블루 등" }
      - { type: 웹툰, host: 무툰 }
    summary: |
      북벽의 후예 진무원이 북천문을 부활시켜 밀야·운중천 등
      세력들과 격돌하는 정통 무협물.

  일편독심:
    author: 천사같은
    platforms:
      - { type: 웹소설, host: 노벨피아 }
    summary: |
      불우한 남자가 무협소설 속 사천당가의 악녀 당소소에게 빙의되는
      TS·빙의 무협. 정천무관에서 구파일방 무공을 두루 다룸.

  시한부 천재가 살아남는 법:
    author: 청시소
    platforms:
      - { type: 웹소설, host: "문피아·네이버 시리즈" }
    summary: |
      하늘이 내린 재능으로 시한부가 된 주인공이
      몸을 고치고자 무림을 누비는 퓨전 무협.

  군림천하:
    author: 용대운
    platforms:
      - { type: 웹소설, host: "카카오페이지·네이버 시리즈·북큐브·리디 등" }
      - { type: 웹툰, host: "카카오페이지 (2025-)" }
      - { type: 출판, host: 파피루스 }
    summary: |
      쇠락해가는 종남파를 이끌고 무림 제패를 꿈꾸는
      진산월의 이야기. 한국 신무협 정전급 베스트셀러.

  신마경천기:
    author: "일황 (웹툰: 곰국)"
    platforms:
      - { type: 웹소설, host: "카카오페이지·네이버 시리즈·리디 등" }
      - { type: 웹툰, host: 카카오웹툰 }
    summary: |
      죽음 직후 환생한 주인공이 정파 무림의 위선자들에 맞서
      복수하며 성장하는 이야기.

  광마회귀:
    author: 유진성
    platforms:
      - { type: 웹소설, host: 네이버 시리즈 }
      - { type: 웹툰, host: "네이버 웹툰" }
    summary: |
      광증을 가진 남자가 평범했던 점소이 시절로 회귀하여
      자신과 약자들을 지키기 위해 강호에 맞선다.

  망나니 소교주로 환생했다:
    author: 대은호
    platforms:
      - { type: 웹소설, host: 네이버 시리즈 }
      - { type: 웹툰, host: "네이버 웹툰" }
    summary: |
      정파의 천재 무인이 독살당했다가 마교 소교주의 몸으로
      환생해 정파로 돌아가기 위해 분투하는 이야기.

  나노마신:
    author: 한중월야
    platforms:
      - { type: 웹소설, host: "문피아·네이버 시리즈" }
      - { type: 웹툰, host: 네이버 웹툰 }
    summary: |
      마교의 최하위 서열 천여운이 미래에서 온 후손으로부터
      나노머신을 주입받아 인생이 완전히 바뀌는 이야기.

  # ─── 세가 중심 작품 ───
  남궁세가 손녀딸의 귀환:
    author: The eun (소설) · 적새/휘모리 (웹툰)
    platforms:
      - { type: 웹소설, host: 카카오페이지 }
      - { type: 웹툰, host: "카카오페이지·카카오웹툰" }
    summary: |
      살수에게 죽은 후 13살로 회귀하여 남궁세가로 돌아가
      가족을 되찾으며 펼쳐지는 무협 로맨스.

  사천당가의 검신급 소가주가 되었다:
    author: 화계(火鷄)
    platforms:
      - { type: 웹소설, host: "문피아·네이버 시리즈" }
    summary: |
      독과 암기의 명가 사천당가에서 전생의 검술 기억을 깨운
      소가주의 평범하지 않은 일상.

  하북팽가 막내아들:
    author: 무향(武香)
    platforms:
      - { type: 웹소설, host: 문피아 }
    summary: |
      도왕이라 불렸던 팽지혁이 방구석 둔재였던 하북팽가
      사공자(막내아들)로 환생하는 회귀 무협.

  하북팽가 검술천재:
    author: 이도훈
    platforms:
      - { type: 웹소설, host: "카카오페이지·네이버 시리즈·리디·미스터블루 등" }
    summary: |
      하북 최고의 겁쟁이라 불리던 팽한빈이 토사구팽을 당한 뒤
      20년 전으로 회귀해 검술천재로 부활하는 이야기.

factions:
  # ═════════════════════════════════════════════════════════
  # 정파 — 구파일방 (10파 + 1방)
  # ═════════════════════════════════════════════════════════
  - id: shaolin
    name_ko: 소림사
    name_zh: 少林寺
    category: 정파
    subcategory: 구파일방
    base:
      name: 숭산
      province: 하남 등봉
      coords: [34.5103, 112.9362]
      coord_confidence: high
    notes: |
      정파 태산북두. 권법·곤법·내공의 본산.
    common:
      aliases: [태산북두, 천하제일사찰]
      martial_arts: [역근경, 세수경, 72절기, 백보신권, 금강불괴]
      figures: [달마, 혜능]
      traits: 정파의 정신적 중심. 외공·내공의 정점이자 구파일방 수장.
      history: |
        달마가 창건한 불교 사찰에서 출발. 한국 신무협에선 정파 무림맹의
        정신적 지주이자 늘 정점에 있는 문파로 묘사된다.
    variants:
      화산귀환:
        figures: [법정(장문인), 법계(일장로)]
        role: 구파일방 수장. 정파의 정신적 지주.
        note: 법계는 천면수사와 대등한 무위의 일장로.
      북검전기:
        figures: [불영신승, 설원, 혈귀승 설공]
        role: 정파 거두.
        note: 설공은 달마삼검을 익힌 유일한 인물.
      일편독심:
        figures: [보현 방장]
        role: 정파 최고 문파.
      시한부 천재가 살아남는 법:
        figures: [범허(방장), 사대금강 원적]
        role: 정파제일의 위상. 범허는 절세고수 중 손꼽힘.
      군림천하:
        figures: [대방선사(36대 방장), 팔대신승]
        role: 중원무림 태산북두. 종남파 구파 복귀를 공식 지지.
      신마경천기:
        figures: [불성 방장승]
        role: 정파무림 양대강자 중 하나. 의혈문 이옥검주로 활동.

  - id: wudang
    name_ko: 무당파
    name_zh: 武當派
    category: 정파
    subcategory: 구파일방
    base:
      name: 무당산
      province: 호북 단강구
      coords: [32.4019, 111.0042]
      coord_confidence: high
    notes: |
      도가 무파. 검법·태극 내공. 소림과 더불어 정파의 양대 산맥.
    common:
      aliases: [도가 무파의 종주]
      martial_arts: [태극권, 태극검, 양의검법, 무당장권, 진무십이검]
      figures: [장삼풍, 진무대제]
      traits: 도가의 부드러움(柔)을 무공으로 구현. 소림과 함께 정파 양대 산맥.
      history: |
        장삼풍이 개창한 도가 무파. 무당산의 자연 속에서 태극의 이치를
        무공으로 체화. 한국 신무협에서도 소림과 더불어 늘 정점.
    variants:
      화산귀환:
        figures: [허도(장문인), 허산, 무진]
        role: 천하검 종리곡과 더불어 구파 정점급 무파.
      북검전기:
        figures: [적엽진인(창술 대가), 해검진인]
        role: 정파 거두. 창술 명가로 묘사.
      일편독심:
        figures: [현태진인(극천)]
        role: 도교 무학의 정점.
      시한부 천재가 살아남는 법:
        figures: [장삼봉(개파조사, 고금제일검), 현공(장문인), 옥암(후계자)]
        role: 정파 양대 산맥.
        note: 장삼봉은 작중 시점엔 전설로만 언급.
      군림천하:
        figures: [현령진인(32대 장문인), 무당십이검(청운·청현·청명)]
        role: 구대문파 양대산맥.
        note: 기산취악 종남파 퇴출 주도, 이후 중립으로 전환.

  - id: huashan
    name_ko: 화산파
    name_zh: 華山派
    category: 정파
    subcategory: 구파일방
    base:
      name: 화산
      province: 섬서 화음
      coords: [34.4836, 110.0867]
      coord_confidence: high
    notes: |
      매화검법·자하신공. 한국 신무협 주역 단골(화산귀환).
    common:
      aliases: [매화의 검파]
      martial_arts: [이십사수매화검법, 자하신공, 매화검진, 천섬광검]
      figures: [매화검존(전설)]
      traits: 매화를 모티프로 한 검파. 검(劍)의 정점 중 하나.
      history: |
        섬서 화산에 자리잡은 검파. 옛 무협에선 검종(劍宗)·기종(氣宗)
        논쟁의 무대였고, 한국 신무협에선 매화검존 전설을 통해 부흥하는
        서사가 자주 사용됨.
    variants:
      화산귀환:
        figures: [청명(매화검존, 주인공), 운암, 조한, 윤종, 백천, 송강유]
        role: 작품의 주역. **정파 부흥**과 천우맹 결성의 중심.
        note: |
          작중 시점 직전 [사패련](https://namu.wiki/w/화산귀환/설정)의 공격으로
          한 차례 멸문 위기. 청명의 회귀로 옛 동맹(사천당가 등) 부활시키며 부흥.
      북검전기:
        figures: [칠성 장문인]
        role: 정파 정의의 한 축. 수라조의 진실을 고발.
      시한부 천재가 살아남는 법:
        figures: [율하낭랑(장문인), 유현]
        role: 율하낭랑은 구파 수장 중 검재 최정점. 유현은 주인공과 우정.
      군림천하:
        figures: [용진산(검봉·장문인), 매장원(2인자·쾌의당 간자), 매화사절(송인혁·북문도)]
        role: 종남파와 섬서성 패권 경쟁.
        note: 회람연에서 1무 4패로 종남에 완패. 매장원은 쾌의당 첩자.

  - id: emei
    name_ko: 아미파
    name_zh: 峨嵋派
    category: 정파
    subcategory: 구파일방
    base:
      name: 아미산
      province: 사천 아미산시
      coords: [29.5201, 103.3315]
      coord_confidence: high
    notes: |
      여성 중심 문파. 검법·내공.
    common:
      aliases: [비구니의 검]
      martial_arts: [아미검법, 구양신공(일부), 복호장]
      figures: [곽양(의천도룡기 전승)]
      traits: 비구니 중심의 여성 정파. 사천 무림의 한 축.
      history: |
        곽양이 개창했다는 전설. 사천 아미산을 본거지로 하며,
        한국 신무협에선 사천당가·청성파와 함께 사천 정파 트리오를 이룸.
    variants:
      화산귀환:
        figures: [관해사태(장문인), 금소, 금화]
        role: 사천 정파의 한 축.
        note: 사패련과의 충돌에서 관해사태 전사.
      일편독심:
        figures: [무검신니]
        role: 여성 정파 무공 전수자.
      군림천하:
        figures: [자죽신니(최고수), 흑미륵 원정]
        role: 종남파 우호 문파.
        note: 기산취악 당시 유일하게 종남파 축출에 반대.

  - id: kunlun
    name_ko: 곤륜파
    name_zh: 崑崙派
    category: 정파
    subcategory: 구파일방
    base:
      name: 곤륜산
      province: 청해
      coords: [35.60, 94.00]
      coord_confidence: medium
    notes: |
      청해 서역의 정파. 마교 침공 시 첫 방어선.
    common:
      aliases: [서역의 정파, 멸마의 검]
      martial_arts: [양의검법, 운룡대팔식, 정양침, 곤륜검법]
      figures: [곤륜파 역대 장문인]
      traits: 서역의 정파. 마교와 가장 가까운 거리에 있어 마교 대항의 최전선.
      history: |
        청해 곤륜산을 본거지로 한 도가 검파. 한국 신무협에선 마교 침공 시
        곤륜이 먼저 무너지는 묘사가 잦아 "비운의 정파" 이미지가 굳음.
    variants:
      화산귀환:
        figures: []
